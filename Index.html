<body>
<div class="wrap">
<header><h1>📚 Mis pendientes</h1><button class="btn sec sm" data-act="theme" aria-label="Cambiar tema">🌓 Tema</button></header>
<nav id="nav"></nav>
<main id="app"></main>
</div>
<dialog id="dlg">
<h3 id="dt">Materia</h3>
<label>Nombre<input id="f-name" maxlength="60"></label>
<label>Profesor<input id="f-teacher" maxlength="60"></label>
<div class="two"><label>Fecha límite<input id="f-date" type="date"></label>
<label>Estado<select id="f-status"><option value="debo">Debo</option><option value="proceso">En proceso</option><option value="aprobada">Aprobada</option></select></label></div>

<div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn sec" data-act="cancel">Cancelar</button><button class="btn" data-act="saveSubj">Guardar</button></div>
</dialog>
<script>
var S=load(),tab='panel',editId=null,open={},noteOpen={},selfQ=null,tm={left:1500,mode:'foco',run:false,h:null};
var METHODS=['Repaso espaciado','Pomodoro','Autoevaluación','Resumen / mapa mental','Otro'];
var ST={debo:'Debo',proceso:'En proceso',aprobada:'Aprobada'},TS={pendiente:'Pendiente',estudiando:'Estudiando',dominado:'Dominado'};
function load(){try{var d=JSON.parse(localStorage.getItem('pendientes-v1'));if(d&&d.subjects)return d}catch(e){}return{subjects:[],log:[],theme:null}}
function save(){try{localStorage.setItem('pendientes-v1',JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function link(s){return esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function days(d){if(!d)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-t)/864e5)}
function dlabel(d){var n=days(d);if(n===null)return'Sin fecha';if(n<0)return'Venció hace '+(-n)+' d';if(n===0)return'Hoy';if(n===1)return'Mañana';return'En '+n+' días'}
function prog(s){if(!s.topics.length)return s.status==='aprobada'?100:0;var p=0;s.topics.forEach(function(t){p+=t.st==='dominado'?1:t.st==='estudiando'?.5:0});return Math.round(p/s.topics.length*100)}
function bar(p){return'<div class="bar"><i style="width:'+p+'%"></i></div>'}
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme')}
function subj(id){return S.subjects.filter(function(s){return s.id===id})[0]}

function nav(){var T=[['panel','📊 Panel'],['materias','📚 Materias'],['hoy','🎯 Hoy'],['estudio','⏱️ Estudio']];
$('nav').innerHTML='<div class="brand"><span class="lg"></span>Academic OS</div><div class="items">'+NV.map(function(t){return'<button class="'+(tab===t[0]?'on':'')+'" data-act="tab" data-id="'+t[0]+'">'+ic(t[2])+'<span class="f">'+t[1]+'</span><span class="s">'+(t[3]||t[1])+'</span></button>'}).join('')+'</div><div class="sbot"><button data-act="theme">'+ic('sun')+'<span class="f">Tema visual</span></button><div class="user"><span class="av">TÚ</span><div><b>Estudiante</b><div class="mut">Datos en este dispositivo</div></div></div></div>'}
function $(s){return document.querySelector(s)}

return h}

function render(){nav();var v={panel:vPanel,materias:vMaterias,hoy:vHoy,estudio:vEstudio,metodos:vMetodos,historial:vHist}[tab];$('#app').innerHTML=v()}
function tick(){tm.left--;if(tm.left<=0){clearInterval(tm.h);tm.run=false;try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}alert(tm.mode==='foco'?'¡Tiempo! Toma un descanso de 5 minutos.':'Descanso terminado. ¡A estudiar!');tm.mode=tm.mode==='foco'?'descanso':'foco';tm.left=tm.mode==='foco'?1500:300;render();return}
var c=$('#clock');if(c)c.textContent=fmt(tm.left)}
function openForm(id){editId=id;var s=id?subj(id):{name:'',teacher:'',date:'',status:'debo',cur:'',need:''};
$('#dt').textContent=id?'Editar materia':'Nueva materia';
$('#f-name').value=s.name;$('#f-teacher').value=s.teacher;$('#f-date').value=s.date;$('#f-status').value=s.status;$('#f-cur').value=s.cur;$('#f-need').value=s.need;$('#dlg').showModal()}
function addTopic(id){var i=$('#nt-'+id),v=i.value.trim();if(!v)return;subj(id).topics.push({id:uid(),name:v,st:'pendiente',note:''});save();render();var n=$('#nt-'+id);if(n)n.focus()}

document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;var a=b.dataset.act,id=b.dataset.id,tid=b.dataset.tid,s=id&&subj(id);
if(a==='tab'){tab=id;render()}
else if(a==='study'){var tt=s.topics.filter(function(x){return x.id===tid})[0];if(tt&&tt.st==='pendiente')tt.st='estudiando';if(s.status==='debo')s.status='proceso';save();tab='estudio';render()}
else if(a==='theme'){S.theme=S.theme==='light'?'dark':'light';applyTheme();save()}
else if(a==='newSubj')openForm(null);
else if(a==='editSubj')openForm(id);
else if(a==='cancel')$('#dlg').close();
else if(a==='saveSubj'){var nm=$('#f-name').value.trim();if(!nm){$('#f-name').focus();return}
var d={name:nm,teacher:$('#f-teacher').value.trim(),date:$('#f-date').value,status:$('#f-status').value,cur:$('#f-cur').value,need:$('#f-need').value};
if(editId)Object.assign(subj(editId),d);else{d.id=uid();d.topics=[];S.subjects.push(d);open[d.id]=true;tab='materias'}
save();$('#dlg').close();render()}
else if(a==='delSubj'){if(confirm('¿Eliminar "'+s.name+'" y todos sus temas?')){S.subjects=S.subjects.filter(function(x){return x.id!==id});save();render()}}
else if(a==='toggle'){open[id]=!open[id];render()}
else if(a==='addTopic')addTopic(id);
else if(a==='cycle'){var t=s.topics.filter(function(x){return x.id===tid})[0],o=['pendiente','estudiando','dominado'];t.st=o[(o.indexOf(t.st)+1)%3];
if(s.topics.length&&s.topics.every(function(x){return x.st==='dominado'})&&s.status!=='aprobada'&&confirm('¡Dominaste todos los temas! ¿Marcar "'+s.name+'" como aprobada?'))s.status='aprobada';
else if(t.st!=='pendiente'&&s.status==='debo')s.status='proceso';
save();render()}
else if(a==='delTopic'){s.topics=s.topics.filter(function(x){return x.id!==tid});save();render()}
else if(a==='noteBtn'){noteOpen[tid]=!noteOpen[tid];render()}
else if(a==='tstart'){if(tm.run){clearInterval(tm.h);tm.run=false}else{tm.run=true;tm.h=setInterval(tick,1000)}render()}
else if(a==='treset'){clearInterval(tm.h);tm.run=false;tm.left=tm.mode==='foco'?1500:300;render()}
else if(a==='tmode'){clearInterval(tm.h);tm.run=false;tm.mode=tm.mode==='foco'?'descanso':'foco';tm.left=tm.mode==='foco'?1500:300;render()}
else if(a==='otherQ'){var L=todayList();if(L.length){selfQ=L[Math.floor(Math.random()*L.length)].t.id;render()}}
else if(a==='addLog'){S.log.push({id:uid(),m:$('#l-m').value,r:$('#l-r').value,sid:$('#l-s').value,n:$('#l-n').value.trim(),d:new Date().toLocaleDateString('es')});save();render()}
else if(a==='delLog'){S.log=S.log.filter(function(x){return x.id!==id});save();render()}});
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var t=e.target;
if(t.dataset&&t.dataset.add)addTopic(t.dataset.add);
else if(t.dataset&&t.dataset.act==='note'){subj(t.dataset.id).topics.filter(function(x){return x.id===t.dataset.tid})[0].note=t.value.trim();noteOpen[t.dataset.tid]=false;save();render()}});
applyTheme();render();
</script>
</body>
</html>
